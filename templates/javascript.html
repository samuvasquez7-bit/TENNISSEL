<!-- Acciones específicas del navbar; menú y perfil se gestionan desde carrito.js. -->
<script>
if (!window.tennisselPremiumAlertBound) {
    window.tennisselPremiumAlertBound = true;
    document.addEventListener("DOMContentLoaded", function() {
        const premiumAlertBtn = document.querySelector('.premium-login-alert');
        if (premiumAlertBtn) {
            premiumAlertBtn.dataset.bound = "true";
            premiumAlertBtn.addEventListener('click', function(e) {
                e.preventDefault();
                const confirmar = confirm("¡Para acceder a los beneficios Premium de TENNISSEL necesitas crear una cuenta primero! ¿Quieres registrarte ahora? 🎾");
                if (confirmar) {
                    window.location.href = "{{ url_for('registro') }}";
                }
            });
        }
    });
}
</script>
