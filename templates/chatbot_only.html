<div id="tennissel-widgets" class="tennissel-widgets" data-user-id="{{ session.get('user_id', '') }}" data-role="{{ session.get('role', 'cliente') }}">
    <div class="widget-dock-heading"><span>Accesos rápidos</span><button id="widget-dock-toggle" class="widget-dock-toggle" type="button" aria-label="Ocultar accesos flotantes" aria-expanded="true"><i class="fa-solid fa-chevron-down"></i></button></div>
    <div class="widget-launchers">
        <button id="chatbot-launcher" class="widget-launcher widget-launcher-chat" type="button" aria-label="Abrir Tenny, asistente virtual"><span class="widget-launcher-icon"><img class="widget-assistant-avatar" src="{{ url_for('static', filename='IMG/tenny-avatar.png') }}" alt=""></span><div class="widget-launcher-copy"><strong>Tenny</strong><small>Asistente virtual</small></div><i class="fa-solid fa-chevron-right widget-launcher-arrow" aria-hidden="true"></i></button>
        <a href="{{ url_for('mapas') }}" class="widget-launcher widget-launcher-maps" aria-label="Ir a Mapas y encontrar canchas"><span class="widget-launcher-icon"><i class="fa-solid fa-map-location-dot"></i></span><div class="widget-launcher-copy"><strong>Mapas</strong><small>Encuentra canchas</small></div><i class="fa-solid fa-arrow-up-right-from-square widget-launcher-arrow" aria-hidden="true"></i></a>
    </div>
    <section id="chatbot-window" class="widget-panel widget-panel-chatbot widget-hidden" aria-label="Tenny">
        <header class="widget-header widget-chat-header"><img class="widget-chat-profile" src="{{ url_for('static', filename='IMG/tenny-avatar.png') }}" alt="Tenny"><div class="widget-chat-contact"><strong>Tenny</strong><small><span class="widget-chat-online"></span> En línea · Asistente virtual</small></div><button class="btn-close-widget" data-close-widget="chatbot-window" type="button" aria-label="Cerrar chat">&times;</button></header>
        <div class="chatbot-shortcuts" aria-label="Preguntas rápidas"><button type="button" data-chatbot-prompt="¿Cómo hago una reserva?">Reservas</button><button type="button" data-chatbot-prompt="¿Dónde están los jugadores?">Jugadores</button><button type="button" data-chatbot-prompt="¿Qué incluye Premium?">Premium</button></div>
        <div id="chatbot-messages-body" class="chat-messages-container" aria-live="polite" aria-label="Conversación con Tenny"><div class="chatbot-message-row chatbot-message-incoming"><img class="chatbot-message-avatar" src="{{ url_for('static', filename='IMG/tenny-avatar.png') }}" alt=""><div class="msg-bubble msg-other">¡Hola! Soy Tenny, tu asistente de TENNISSEL. Pregúntame sobre reservas, jugadores, profesores, entrenamientos, productos o tu cuenta.<time class="chatbot-message-time"></time></div></div></div>
        <form id="chatbot-form" class="chat-input-area"><input type="text" id="chatbot-input-text" placeholder="Escribe un mensaje..." autocomplete="off" maxlength="500" aria-label="Escribe un mensaje para Tenny"><button type="submit" aria-label="Enviar mensaje"><i class="fa-solid fa-paper-plane"></i></button></form>
    </section>
</div>
